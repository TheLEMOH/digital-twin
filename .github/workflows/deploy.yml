name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-restart:
    runs-on: self-hosted
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start or restart app
        shell: cmd
        run: pm2 restart digital-twin --update-env || pm2 start .output/server/index.mjs --name digital-twin

      - name: Save pm2 process list
        shell: cmd
        run: pm2 save